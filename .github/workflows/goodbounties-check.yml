name: Check GoodBounties changes

# Test changes, not each live inventory. PR code runs without inventory credentials.
on:
  pull_request:
    paths:
      - '.github/goodbounties/**'
      - '.github/workflows/goodbounties-*.yml'
  push:
    branches: [master]
    paths:
      - '.github/goodbounties/**'
      - '.github/workflows/goodbounties-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline tests
        run: python3 -m unittest discover -s .github/goodbounties/tests -v
      - name: Validate the actual configuration (no API calls)
        working-directory: .github/goodbounties
        run: |
          python3 - <<'PY'
          from inventory import HERE, read_settings, validate_settings
          validate_settings(read_settings(HERE / 'config.json'))
          PY
