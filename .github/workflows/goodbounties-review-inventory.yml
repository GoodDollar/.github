name: GoodBounties review inventory (read only)

on:
  workflow_dispatch:
  # Other repositories must explicitly send this event; .github does not inherit their events.
  repository_dispatch:
    types: [goodbounties-review-refresh]
  # Enable only after the documented pilot review:
  # schedule:
  #   - cron: '17 * * * *'

permissions:
  contents: read

# Each run scans every listed repository, so coalesced events do not lose assignments.
concurrency:
  group: goodbounties-review-inventory
  cancel-in-progress: false

jobs:
  inventory:
    # One on/off switch. Review report visibility before enabling artifact uploads.
    if: >-
      vars.GOODBOUNTIES_INVENTORY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Run only central, trusted code. Never check out a contributor PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect inventory
        env:
          # Cross-repository read access; the built-in token only covers this repository.
          GOODBOUNTIES_READ_TOKEN: ${{ secrets.GOODBOUNTIES_READ_TOKEN }}
        run: python3 .github/goodbounties/inventory.py --output "$RUNNER_TEMP/goodbounties-report"
      - name: Save report, including incomplete runs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goodbounties-review-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/goodbounties-report/
          if-no-files-found: ignore
          retention-days: 7
