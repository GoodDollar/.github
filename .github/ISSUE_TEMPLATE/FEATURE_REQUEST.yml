name: Feature Request (GoodBounties)
description: Feature request format for GoodBounties
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: Briefly describe the feature or improvement you are requesting.
      placeholder: What would you like to add or change?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the need this feature addresses and who would benefit from it.
      placeholder: What problem does this solve, or what opportunity does it create?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work. Include any alternatives you considered.
      placeholder: What should the expected experience or behavior be?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List the outcomes that would make this feature complete.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any references, screenshots, mockups, constraints, or related issues that may help.
      placeholder: Links, images, technical notes, or other useful context.
    validations:
      required: false


  - type: textarea
    id: create_the_plan
    attributes:
      label: Create the plan (keep this section in the issue body)
      description: |
        This content is persisted in the issue body and should be used by the planner/copilot flow.
      value: |
        ## Create the plan

        Based on the above description create an execution plan in a **new sub-issue** and preserve the original issue content unchanged.
        Do not execute the plan until given instructions to do so.

        Sub-issue requirements:

        - Title format: `[DRAFT][PLAN] <what issue is being planned>`
        - Type: `Task`
        - Description must start with: `<sub-issue title>`
        - Link the sub-issue back to this parent issue.

        Instructions when creating the plan:

        - Map relevant files that are too be used as reference from all repos mentioned
        - import existing @GoodDollar packages
        - Map new components that should be created. Assess when a new component should be created in the new savings widget package or made part of the reusable packages/ui

        Plan specification required sections:

        - Required states, flows, and behaviors
        - Execution plan
        - acceptance criteria
        - human-reviewer checklist
    validations:
      required: true
